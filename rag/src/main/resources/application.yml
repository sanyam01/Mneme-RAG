
spring:
  application:
    name: resume-rag-app
  datasource:
    # These placeholders match the environment variables in your docker-compose.yml
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Custom configuration for your RAG logic
rag:
  provider: ${RAG_PROVIDER:ollama}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://rag_ollama:11434}
  vllm:
    base-url: ${VLLM_BASE_URL:http://rag_vllm:8000/v1}